version: '3.8'

services:
  # Single Cassandra node for testing
  cassandra:
    image: cassandra:5.0
    container_name: cassandra-test
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_NUM_TOKENS=256
    networks:
      - test-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local;'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Dask scheduler
  dask-scheduler:
    image: dask-scheduler-cassandra:latest
    container_name: dask-scheduler-test
    ports:
      - "8786:8786"  # Scheduler port
      - "8787:8787"  # Dashboard port
    networks:
      - test-network
    environment:
      - DASK_DISTRIBUTED__SCHEDULER__WORK_STEALING=True
      - PYTHONPATH=/app/src
    volumes:
      - ../../src:/app/src:ro

  # Dask workers
  dask-worker-1:
    image: dask-worker-cassandra:latest
    container_name: dask-worker-test-1
    command: ["tcp://dask-scheduler-test:8786", "--nthreads", "2", "--memory-limit", "2GB", "--name", "worker-1"]
    depends_on:
      - dask-scheduler
    networks:
      - test-network
    environment:
      - DASK_DISTRIBUTED__WORKER__MEMORY__TARGET=0.75
      - DASK_DISTRIBUTED__WORKER__MEMORY__SPILL=0.85
      - DASK_DISTRIBUTED__WORKER__MEMORY__PAUSE=0.95
      - PYTHONPATH=/app/src
      - CASSANDRA_CONTACT_POINTS=cassandra-test
    volumes:
      - ../../src:/app/src:ro

  dask-worker-2:
    image: dask-worker-cassandra:latest
    container_name: dask-worker-test-2
    command: ["tcp://dask-scheduler-test:8786", "--nthreads", "2", "--memory-limit", "2GB", "--name", "worker-2"]
    depends_on:
      - dask-scheduler
    networks:
      - test-network
    environment:
      - DASK_DISTRIBUTED__WORKER__MEMORY__TARGET=0.75
      - DASK_DISTRIBUTED__WORKER__MEMORY__SPILL=0.85
      - DASK_DISTRIBUTED__WORKER__MEMORY__PAUSE=0.95
      - PYTHONPATH=/app/src
      - CASSANDRA_CONTACT_POINTS=cassandra-test
    volumes:
      - ../../src:/app/src:ro

networks:
  test-network:
    driver: bridge
