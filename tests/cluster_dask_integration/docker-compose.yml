version: '3.8'

services:
  # Cassandra 5 cluster
  cassandra1:
    image: cassandra:5.0
    container_name: cassandra-node1
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_NUM_TOKENS=256
    networks:
      - dask-cassandra-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local;'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  cassandra2:
    image: cassandra:5.0
    container_name: cassandra-node2
    ports:
      - "9043:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_NUM_TOKENS=256
      - CASSANDRA_SEEDS=cassandra1
    depends_on:
      cassandra1:
        condition: service_healthy
    networks:
      - dask-cassandra-network

  cassandra3:
    image: cassandra:5.0
    container_name: cassandra-node3
    ports:
      - "9044:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=TestCluster
      - CASSANDRA_DC=datacenter1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_NUM_TOKENS=256
      - CASSANDRA_SEEDS=cassandra1
    depends_on:
      cassandra1:
        condition: service_healthy
    networks:
      - dask-cassandra-network

  # Dask scheduler
  dask-scheduler:
    image: dask-scheduler-cassandra:latest
    container_name: dask-scheduler
    ports:
      - "8786:8786"  # Scheduler port
      - "8787:8787"  # Dashboard port
    networks:
      - dask-cassandra-network
    environment:
      - DASK_DISTRIBUTED__SCHEDULER__WORK_STEALING=True
      - DASK_DISTRIBUTED__SCHEDULER__ALLOWED_FAILURES=3
      - DASK_DISTRIBUTED__SCHEDULER__BANDWIDTH=100000000  # 100 MB/s
      - PYTHONPATH=/app/src
    volumes:
      - ../../src:/app/src:ro

  # Dask workers
  dask-worker-1:
    image: dask-worker-cassandra:latest
    container_name: dask-worker-1
    command: ["tcp://dask-scheduler:8786", "--nthreads", "2", "--memory-limit", "2GB", "--name", "worker-1"]
    depends_on:
      - dask-scheduler
    networks:
      - dask-cassandra-network
    environment:
      - DASK_DISTRIBUTED__WORKER__MEMORY__TARGET=0.75  # 75% of memory limit
      - DASK_DISTRIBUTED__WORKER__MEMORY__SPILL=0.85   # 85% of memory limit
      - DASK_DISTRIBUTED__WORKER__MEMORY__PAUSE=0.95   # 95% of memory limit
      - PYTHONPATH=/app/src
      - CASSANDRA_CONTACT_POINTS=cassandra1
    volumes:
      - ../../src:/app/src:ro

  dask-worker-2:
    image: dask-worker-cassandra:latest
    container_name: dask-worker-2
    command: ["tcp://dask-scheduler:8786", "--nthreads", "2", "--memory-limit", "2GB", "--name", "worker-2"]
    depends_on:
      - dask-scheduler
    networks:
      - dask-cassandra-network
    environment:
      - DASK_DISTRIBUTED__WORKER__MEMORY__TARGET=0.75
      - DASK_DISTRIBUTED__WORKER__MEMORY__SPILL=0.85
      - DASK_DISTRIBUTED__WORKER__MEMORY__PAUSE=0.95
      - PYTHONPATH=/app/src
      - CASSANDRA_CONTACT_POINTS=cassandra1
    volumes:
      - ../../src:/app/src:ro

  dask-worker-3:
    image: dask-worker-cassandra:latest
    container_name: dask-worker-3
    command: ["tcp://dask-scheduler:8786", "--nthreads", "2", "--memory-limit", "2GB", "--name", "worker-3"]
    depends_on:
      - dask-scheduler
    networks:
      - dask-cassandra-network
    environment:
      - DASK_DISTRIBUTED__WORKER__MEMORY__TARGET=0.75
      - DASK_DISTRIBUTED__WORKER__MEMORY__SPILL=0.85
      - DASK_DISTRIBUTED__WORKER__MEMORY__PAUSE=0.95
      - PYTHONPATH=/app/src
      - CASSANDRA_CONTACT_POINTS=cassandra1
    volumes:
      - ../../src:/app/src:ro

networks:
  dask-cassandra-network:
    driver: bridge
